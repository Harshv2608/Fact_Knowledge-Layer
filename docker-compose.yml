version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: fact_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factpass}
      POSTGRES_DB: ${POSTGRES_DB:-factdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: fact_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-factuser}:${POSTGRES_PASSWORD:-factpass}@db:5432/${POSTGRES_DB:-factdb}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - MOCK_LLM=${MOCK_LLM:-0}
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fact_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  postgres_data:
